# crank's browser playground — see playground/README.md. A separate crate
# (and its own workspace) so the CLI's own dependencies stay exactly what
# the CLI needs.
[package]
name = "crank-playground"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
# examples/ holds the playground's Markdown examples, not Cargo examples.
autoexamples = false

# cdylib is the WebAssembly module `just playground-build` builds; rlib lets the
# tests link it natively.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Named for the library it provides (the main crate's `[lib]` is `crank`),
# not its `crank-cli` package name, so cargo-machete (`just machete`) can
# match it to the `use crank::...` lines that use it.
crank = { package = "crank-cli", path = ".." }
# Plain data across the JavaScript boundary: the page sends the tree as
# JSON and gets the result back as JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `just playground-build` runs the wasm-bindgen CLI at exactly the version
# Cargo.lock pins this to, which the two require.
wasm-bindgen = "=0.2.129"

# Not used directly: depending on rhai here only switches on its
# `wasm-bindgen` feature for the WebAssembly build, which gives rhai's
# hasher (ahash, via getrandom) the browser's random number source —
# wasm32-unknown-unknown has none of its own.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rhai = { version = "1", features = ["wasm-bindgen"] }

# Same strictness as the main crate.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
missing_docs_in_private_items = "warn"
# The main crate's `restriction` lints and complexity limit — see the
# comment there.
unwrap_used = "warn"
indexing_slicing = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
cognitive_complexity = "warn"

# Smaller over faster for the WebAssembly module: it's downloaded on every
# visit, and a playground-sized run takes a few milliseconds anyway.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[workspace]
members = ["."]
